name: ecotrack
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Mna5_app.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8F9FA"
  image: "assets/icon/Mna5_app.png"
  android_12:
    image: "assets/icon/Mna5_app.png"
    icon_background_color: "#F8F9FA"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/